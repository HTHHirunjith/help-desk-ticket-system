server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${DEV_ADMIN_EMAIL:admin@helpdesk.dev}
    agent-email: ${DEV_AGENT_EMAIL:agent@helpdesk.dev}
    user-email: ${DEV_USER_EMAIL:user@helpdesk.dev}
    admin-first-name: Admin
    admin-last-name: Dev
    agent-first-name: Agent
    agent-last-name: Dev
    user-first-name: User
    user-last-name: Dev
    admin-password: ${DEV_ADMIN_PASSWORD:}
    agent-password: ${DEV_AGENT_PASSWORD:}
    user-password: ${DEV_USER_PASSWORD:}
